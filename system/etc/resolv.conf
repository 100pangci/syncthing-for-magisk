# Shipped by Syncthing for Magisk.
# Statically-linked Go binaries (like Syncthing) look up DNS servers in
# /etc/resolv.conf, which does not exist on many Android devices. Magisk
# mounts this file systemlessly into /system/etc (=/etc) so that Syncthing
# running as the unprivileged 'shell' user can resolve names.
nameserver 8.8.8.8
nameserver 1.1.1.1
