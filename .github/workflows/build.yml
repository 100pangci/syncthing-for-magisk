name: Build Magisk Module

on:
  push:
  workflow_dispatch:
    inputs:
      syncthing_version:
        description: 'Syncthing version to package (e.g. v1.29.7). Leave empty for the latest stable release.'
        required: false
        type: string

permissions:
  contents: write

env:
  SYNCTHING_REPO: syncthing/syncthing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Syncthing version and release channel
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.syncthing_version }}
        run: |
          # Kernel version priority: manual input > git tag (exact match) > latest stable release
          if [ -z "$REQUESTED" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            REQUESTED="${GITHUB_REF_NAME}"
          fi
          if [ -n "$REQUESTED" ]; then
            TAG="$REQUESTED"
            SOURCE="requested (${REQUESTED})"
          else
            TAG=$(gh release view --repo "$SYNCTHING_REPO" --json tagName -q .tagName)
            SOURCE="latest stable release"
          fi

          # The module version always has four components: kernel version plus a
          # module build number, e.g. syncthing v2.1.3 -> module v2.1.3.0
          VERSION="${TAG#v}"
          while [ "$(awk -F. '{print NF}' <<< "$VERSION")" -lt 4 ]; do
            VERSION="${VERSION}.0"
          done
          VERSION_CODE=$(awk -F. -v v="$VERSION" 'BEGIN{split(v,a,"."); printf "%d", a[1]*1000000 + a[2]*10000 + a[3]*100 + a[4]}')
          {
            echo "kernel_tag=$TAG"
            echo "version=$VERSION"
            echo "version_code=$VERSION_CODE"
            echo "zip_name=Syncthing-for-Magisk-v${VERSION}.zip"
          } >> "$GITHUB_OUTPUT"
          echo "Packaging Syncthing ${TAG} as module v${VERSION} (${SOURCE})"

          # Release channels: v* tags -> stable release; main -> pre-release test
          # build; everything else -> artifact only
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            {
              echo "release_tag=${GITHUB_REF_NAME}"
              echo "prerelease=false"
              echo "do_release=true"
            } >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            {
              echo "release_tag=v${VERSION}-pre.${GITHUB_RUN_NUMBER}"
              echo "prerelease=true"
              echo "do_release=true"
            } >> "$GITHUB_OUTPUT"
          else
            echo "do_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Syncthing binary
        env:
          TAG: ${{ steps.version.outputs.kernel_tag }}
        run: |
          TARBALL="syncthing-linux-arm64-${TAG}.tar.gz"
          URL="https://github.com/${SYNCTHING_REPO}/releases/download/${TAG}/${TARBALL}"
          echo "Downloading ${URL}"
          curl -fsSL --retry 3 -o "$TARBALL" "$URL"
          tar -xzf "$TARBALL"
          mv "syncthing-linux-arm64-${TAG}/syncthing" bin/syncthing
          chmod 0755 bin/syncthing
          rm -rf "syncthing-linux-arm64-${TAG}" "$TARBALL"
          file bin/syncthing
          file bin/syncthing | grep -q 'ARM aarch64' || { echo "Not an aarch64 binary"; exit 1; }

      - name: Sync module.prop with packaged version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          sed -i "s/^version=.*/version=v${VERSION}/" module.prop
          sed -i "s/^versionCode=.*/versionCode=${VERSION_CODE}/" module.prop
          grep -E '^(version|versionCode)=' module.prop

      - name: Syntax check scripts
        run: |
          for f in customize.sh service.sh action.sh META-INF/com/google/android/update-binary; do
            sh -n "$f"
          done

      - name: Pack module zip
        env:
          ZIP_NAME: ${{ steps.version.outputs.zip_name }}
        run: |
          test -x bin/syncthing || { echo "bin/syncthing is missing"; exit 1; }
          zip -r9 "$ZIP_NAME" \
            META-INF \
            module.prop \
            customize.sh \
            service.sh \
            action.sh \
            bin \
            system
          sha256sum "$ZIP_NAME" > "$ZIP_NAME.sha256"
          unzip -l "$ZIP_NAME"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.zip_name }}
          path: |
            ${{ steps.version.outputs.zip_name }}
            ${{ steps.version.outputs.zip_name }}.sha256
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: steps.version.outputs.do_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: |
            ${{ steps.version.outputs.zip_name }}
            ${{ steps.version.outputs.zip_name }}.sha256
          generate_release_notes: true
