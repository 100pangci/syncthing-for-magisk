name: Build Magisk Module

on:
  push:
  workflow_dispatch:
    inputs:
      syncthing_version:
        description: 'Syncthing version to package (e.g. v2.1.3). Leave empty for the latest stable release.'
        required: false
        type: string

permissions:
  contents: write

env:
  SYNCTHING_REPO: syncthing/syncthing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Syncthing version and release channel
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.syncthing_version }}
        run: |
          # Version priority: manual input > git tag (exact match) > latest stable release
          if [ -z "$REQUESTED" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            REQUESTED="${GITHUB_REF_NAME}"
          fi
          if [ -n "$REQUESTED" ]; then
            TAG="$REQUESTED"
            SOURCE="requested (${REQUESTED})"
            # The kernel release must exist; an explicitly requested tag may be a prerelease
            gh release view "$TAG" --repo "$SYNCTHING_REPO" --json tagName -q .tagName >/dev/null \
              || { echo "Syncthing release ${TAG} does not exist"; exit 1; }
          else
            # Only full releases -- never release candidates or other prereleases
            TAG=$(gh release list --repo "$SYNCTHING_REPO" --exclude-pre-releases \
                    --limit 1 --json tagName -q '.[0].tagName')
            test -n "$TAG" || { echo "No stable Syncthing release found"; exit 1; }
            SOURCE="latest stable release"
          fi

          # The module version always has four components: kernel version plus a
          # module build number, e.g. syncthing v2.1.3 -> module v2.1.3.0
          VERSION="${TAG#v}"
          while [ "$(awk -F. '{print NF}' <<< "$VERSION")" -lt 4 ]; do
            VERSION="${VERSION}.0"
          done
          VERSION_CODE=$(awk -F. -v v="$VERSION" 'BEGIN{split(v,a,"."); printf "%d", a[1]*1000000 + a[2]*10000 + a[3]*100 + a[4]}')
          {
            echo "kernel_tag=$TAG"
            echo "version=$VERSION"
            echo "version_code=$VERSION_CODE"
            echo "zip_name=Syncthing-for-Magisk-v${VERSION}.zip"
          } >> "$GITHUB_OUTPUT"
          echo "Packaging Syncthing ${TAG} as module v${VERSION} (${SOURCE})"

          # Release channels: v* tags -> stable release; main -> pre-release test
          # build; everything else -> artifact only
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            {
              echo "release_tag=${GITHUB_REF_NAME}"
              echo "prerelease=false"
              echo "do_release=true"
            } >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            {
              echo "release_tag=v${VERSION}-pre.${GITHUB_RUN_NUMBER}"
              echo "prerelease=true"
              echo "do_release=true"
            } >> "$GITHUB_OUTPUT"
          else
            echo "do_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Syncthing binaries (all Android ABIs)
        env:
          TAG: ${{ steps.version.outputs.kernel_tag }}
        run: |
          set -e
          # Android ABI -> Syncthing asset name -> magic string from `file`
          # Only one binary gets kept per device; customize.sh selects it.
          declare -A ASSETS=(
            [arm64-v8a]="linux-arm64"
            [armeabi-v7a]="linux-arm"
            [x86_64]="linux-amd64"
            [x86]="linux-386"
          )
          declare -A MAGIC=(
            [arm64-v8a]="ARM aarch64"
            [armeabi-v7a]="ARM, EABI"
            [x86_64]="x86-64"
            [x86]="Intel i386"
          )
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            st="${ASSETS[$abi]}"
            tarball="syncthing-${st}-${TAG}.tar.gz"
            url="https://github.com/${SYNCTHING_REPO}/releases/download/${TAG}/${tarball}"
            echo "Downloading ${st} -> ${abi}"
            curl -fsSL --retry 3 -o "$tarball" "$url"
            tar -xzf "$tarball"
            mkdir -p "bin/$abi"
            mv "syncthing-${st}-${TAG}/syncthing" "bin/$abi/syncthing"
            chmod 0755 "bin/$abi/syncthing"
            out=$(file "bin/$abi/syncthing")
            echo "$out"
            echo "$out" | grep -q "${MAGIC[$abi]}" || { echo "Unexpected ${abi} binary"; exit 1; }
            rm -rf "syncthing-${st}-${TAG}" "$tarball"
          done

      - name: Sync module.prop with packaged version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          sed -i "s/^version=.*/version=v${VERSION}/" module.prop
          sed -i "s/^versionCode=.*/versionCode=${VERSION_CODE}/" module.prop
          grep -E '^(version|versionCode)=' module.prop

      - name: Syntax check scripts
        run: |
          for f in customize.sh service.sh action.sh META-INF/com/google/android/update-binary; do
            sh -n "$f"
          done

      - name: Pack module zip
        env:
          ZIP_NAME: ${{ steps.version.outputs.zip_name }}
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            test -x "bin/$abi/syncthing" || { echo "bin/$abi/syncthing is missing"; exit 1; }
          done
          zip -r9 "$ZIP_NAME" \
            META-INF \
            module.prop \
            customize.sh \
            service.sh \
            action.sh \
            bin \
            system
          sha256sum "$ZIP_NAME" > "$ZIP_NAME.sha256"
          unzip -l "$ZIP_NAME"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.zip_name }}
          path: |
            ${{ steps.version.outputs.zip_name }}
            ${{ steps.version.outputs.zip_name }}.sha256
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: steps.version.outputs.do_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: |
            ${{ steps.version.outputs.zip_name }}
            ${{ steps.version.outputs.zip_name }}.sha256
          generate_release_notes: true
